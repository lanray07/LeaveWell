name: Native localized iPhone Duo screenshots
on:
  workflow_dispatch:
    inputs:
      only_locale:
        description: Render a single Duo locale (leave blank to render all)
        type: string
        default: ''
      required_sizes:
        description: Capture the primary iPhone and iPad galleries
        type: boolean
        default: false
      include_primary:
        description: Capture primary iPhone and iPad galleries alongside Duo
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  app:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build native app and capture auditor
        run: |
          mkdir -p build
          python3 scripts/validate_project.py
          xcodebuild -project LeaveWell.xcodeproj -scheme LeaveWell -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData -configuration Debug CODE_SIGNING_ALLOWED=NO build > build/duo-build.log 2>&1 || { tail -60 build/duo-build.log; exit 1; }
          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/LeaveWell.app
          cp marketing/source/demo-kitchen.png "$APP/DemoKitchen.png"
          swiftc scripts/audit_native_capture.swift -o build/audit-native-capture
          ditto -c -k --keepParent "$APP" build/DuoCaptureApp.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DuoCaptureApp
          path: |
            build/DuoCaptureApp.zip
            build/audit-native-capture
            build/duo-build.log
          retention-days: 7
  capture:
    if: ${{ !inputs.required_sizes }}
    needs: app
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        locale: ${{ inputs.only_locale != '' && fromJSON(format('[{0}]', toJSON(inputs.only_locale))) || fromJSON('["en-GB","fr","es","de","it","pt-BR","nl","pl","ar","hi","ja","ko","zh-Hans","zh-Hant","tr","id","sv"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DuoCaptureApp
          path: build
      - name: Capture the actual localized app
        env:
          CAPTURE_LOCALE: ${{ matrix.locale }}
        run: |
          ditto -x -k build/DuoCaptureApp.zip build
          chmod +x build/audit-native-capture
          python3 scripts/capture_duo.py --locale "$CAPTURE_LOCALE"
      - uses: actions/upload-artifact@v4
        with:
          name: Duo-${{ matrix.locale }}
          path: build/DuoRaw
          if-no-files-found: error
          retention-days: 30

  required:
    if: inputs.required_sizes || inputs.include_primary
    needs: app
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DuoCaptureApp
          path: build
      - name: Capture native primary gallery
        run: |
          ditto -x -k build/DuoCaptureApp.zip build
          chmod +x build/audit-native-capture
          python3 scripts/capture_duo.py --locale en-GB --family '${{ matrix.family }}'
      - uses: actions/upload-artifact@v4
        with:
          name: Gallery-en-GB-${{ matrix.family }}
          path: build/DuoRaw
          if-no-files-found: error
          retention-days: 30
