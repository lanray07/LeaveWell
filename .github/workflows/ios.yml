name: iPhone Duo capture tools
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect native Duo simulator capture tools
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          mkdir -p build/DuoProbe
          xcodebuild -version > build/DuoProbe/xcode.txt
          xcrun simctl list devices available -j > build/DuoProbe/devices.json
          xcrun simctl list devicetypes -j > build/DuoProbe/devicetypes.json
          xcrun simctl help > build/DuoProbe/simctl.txt
          xcrun simctl io help > build/DuoProbe/io.txt 2>&1 || true
          xcrun simctl help io >> build/DuoProbe/io.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LeaveWell-Duo-tools
          path: build/DuoProbe
          retention-days: 7
