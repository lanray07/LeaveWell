name: Temporary physical-device QA runner
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [build, cleanup]
        default: build
      device_udid:
        type: string
      recipient_public_key:
        type: string
      register_device:
        type: boolean
        default: false
      certificate_id:
        type: string
      profile_id:
        type: string
permissions:
  contents: read
jobs:
  build:
    if: inputs.operation == 'build'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: 02cb92f0e93c8b021443bcbb8eeb80932c113220
          path: wda
          persist-credentials: false
      - name: Build official Appium UI-test runner
        run: |
          mkdir -p wda/Resources/WebDriverAgent.bundle build
          xcodebuild -project wda/WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' -derivedDataPath build/WDA \
            -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.LeaveWell.DeviceQA.WebDriverAgentRunner build-for-testing > build/wda-build.log 2>&1 || { tail -70 build/wda-build.log; exit 1; }
          APP=$(find build/WDA/Build/Products/Debug-iphoneos -maxdepth 1 -name '*Runner.app' -print -quit)
          test -n "$APP"
          ditto -c -k --keepParent "$APP" build/unsigned-runner.zip
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-device-runner
          path: build/unsigned-runner.zip
          retention-days: 1
  sign:
    if: inputs.operation == 'build'
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-device-runner
          path: build
      - name: Sign and encrypt runner for the connected device
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          QA_DEVICE_UDID: ${{ inputs.device_udid }}
          QA_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          QA_REGISTER_DEVICE: ${{ inputs.register_device }}
        run: ruby scripts/device_qa_sign.rb
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-device-runner
          path: build/runner.encrypted.json
          retention-days: 1
      - name: Remove temporary keychain and signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/LeaveWellDeviceQA.keychain-db" || true
          rm -f "$RUNNER_TEMP/LeaveWellDeviceQA.p12"
  cleanup:
    if: inputs.operation == 'cleanup'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Remove only this helper's dedicated signing resources
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          QA_OPERATION: cleanup
          QA_CERTIFICATE_ID: ${{ inputs.certificate_id }}
          QA_PROFILE_ID: ${{ inputs.profile_id }}
        run: ruby scripts/device_qa_sign.rb
