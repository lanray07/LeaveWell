name: iOS validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      archive:
        description: Export a signed IPA using the Apple secrets
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode toolchain
        run: xcodebuild -version
      - name: Validate localization
        run: |
          python3 scripts/validate_project.py
          python3 scripts/test_localization.py
      - name: Core tests
        run: swift test
      - name: Build iOS application
        run: xcodebuild -project LeaveWell.xcodeproj -scheme LeaveWell -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Run iOS service tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPhone" in x["name"]))')
          xcodebuild -project LeaveWell.xcodeproj -scheme LeaveWell -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Save simulator application and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeaveWell-simulator-and-tests
          path: |
            build/DerivedData/Build/Products/Debug-iphonesimulator/LeaveWell.app
            build/Tests.xcresult
          retention-days: 7
  archive:
    if: github.event_name == 'workflow_dispatch' && inputs.archive
    needs: build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve existing Apple app and prepare signing key
        id: apple
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ruby scripts/apple_build_setup.rb
      - name: Archive iOS application
        env:
          APP_BUNDLE_ID: ${{ steps.apple.outputs.bundle_id }}
        run: |
          xcodebuild -project LeaveWell.xcodeproj -scheme LeaveWell -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/LeaveWell.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Export signed IPA with Apple cloud signing
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          xcodebuild -exportArchive -archivePath build/LeaveWell.xcarchive \
            -exportPath build/export -exportOptionsPlist "$RUNNER_TEMP/LeaveWellExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/LeaveWellSigning.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
      - name: Save signed build
        uses: actions/upload-artifact@v4
        with:
          name: LeaveWell-signed-IPA
          path: |
            build/export/*.ipa
            build/LeaveWell.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/LeaveWellSigning.p8" "$RUNNER_TEMP/LeaveWellExportOptions.plist"
